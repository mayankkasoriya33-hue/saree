<!-- ══════════════════════════════════════
     PAGE 5 — Department List
     Edit only this file for Page 5 changes
══════════════════════════════════════ -->
<style>
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:20px;}
.team-card-3d{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 3px 6px rgba(10,35,66,0.06),0 8px 24px rgba(10,35,66,0.09);transition:transform 0.22s,box-shadow 0.22s;cursor:pointer;}
.team-card-3d:hover{transform:translateY(-5px) scale(1.01);box-shadow:0 8px 12px rgba(10,35,66,0.1),0 18px 40px rgba(10,35,66,0.16);}
.team-card-banner{height:80px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.team-card-banner::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,0.3));}
.team-banner-title{position:relative;z-index:1;font-size:15px;font-weight:800;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,0.35);}
.avatar-cluster{display:flex;justify-content:center;padding:0 14px;margin-top:-18px;margin-bottom:8px;position:relative;z-index:2;flex-wrap:wrap;gap:3px;}
.avatar-3d{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.18);flex-shrink:0;transition:transform 0.18s;}
.avatar-3d:hover{transform:scale(1.14) translateY(-2px);}
.team-card-body{padding:6px 14px 12px;}
.team-card-stats{display:flex;gap:6px;margin-bottom:10px;}
.tc-stat{flex:1;text-align:center;background:#f4fbfd;border-radius:8px;padding:7px 4px;border:1px solid #e0f4f8;}
.tc-stat-val{font-size:14px;font-weight:800;color:#0a2342;line-height:1;}
.tc-stat-lbl{font-size:8px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:0.3px;margin-top:2px;}
.team-card-footer{display:flex;gap:6px;padding:0 14px 14px;}
.btn-view-team{flex:1;padding:7px 8px;border-radius:9px;border:1.5px solid #0a7c8c;background:#fff;color:#0a7c8c;font-size:10px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;transition:all 0.15s;}
.btn-view-team:hover{background:#0a7c8c;color:#fff;}
.btn-export-team{flex:1;padding:7px 8px;border-radius:9px;border:none;background:linear-gradient(135deg,#0a2342,#0e4d6e);color:#fff;font-size:10px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;transition:all 0.15s;}
.btn-export-team:hover{background:linear-gradient(135deg,#0a7c8c,#0e4d6e);}
.team-members-panel{display:none;background:#f8fbff;border-top:1.5px solid #e0f4f8;padding:12px 14px;}
.team-members-panel.open{display:block;}
.member-row{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;background:#fff;border:1px solid #e8f4f8;margin-bottom:6px;cursor:pointer;transition:all 0.15s;}
.member-row:hover{background:#e6f7fa;border-color:#0a7c8c;transform:translateX(3px);}
.member-avatar-sm{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0;}
.member-info{flex:1;}
.member-name{font-size:11px;font-weight:700;color:#0a2342;}
.member-desig{font-size:9px;color:#6b7280;margin-top:1px;}

@media(max-width:768px){.team-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}}
@media(max-width:480px){.team-grid{grid-template-columns:1fr;}}
</style>

<div class="page" id="page-5">

  <!-- Controls -->
  <div class="controls-bar">
    <button class="btn-refresh" onclick="loadDeptList()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      Refresh
    </button>
  </div>

  <div id="deptListContainer">
    <div class="loading-state">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
      Loading...
    </div>
  </div>

</div>

<script>
/* ════════════════════════════════
   PAGE 5 — Department List Logic
════════════════════════════════ */

var _avColors=["#0a7c8c","#e74c3c","#f39c12","#27ae60","#9b59b6","#1abc9c","#e67e22","#3498db"];
var _palettes=[
  {bg:"linear-gradient(135deg,#0a2342,#0e4d6e)"},
  {bg:"linear-gradient(135deg,#1e3a5f,#2d6a9f)"},
  {bg:"linear-gradient(135deg,#2d1b69,#5b21b6)"},
  {bg:"linear-gradient(135deg,#065f46,#059669)"},
  {bg:"linear-gradient(135deg,#7c2d12,#ea580c)"},
  {bg:"linear-gradient(135deg,#1e1b4b,#4338ca)"}
];

function loadDeptList(){
  document.getElementById("deptListContainer").innerHTML='<div class="loading-state"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>Loading...</div>';
  google.script.run.withSuccessHandler(function(data){
    deptRawData=data;
    if(data.error){document.getElementById("deptListContainer").innerHTML='<div class="loading-state" style="color:#e05252">⚠️ '+data.error+'</div>';return;}
    renderDeptList(data);
  }).getTeamList();
}

function renderDeptList(data){
  var dTM={};
  (data.digiSales||[]).forEach(function(m){var t=m.team||"Unknown";if(!dTM[t])dTM[t]=[];dTM[t].push(m);});
  var sm=data.smriti||[],of=data.onField||[];
  var total=(data.digiSales||[]).length+sm.length+of.length;

  var html="<div style='text-align:center;padding:14px 0 22px;'><h2 style='font-size:20px;font-weight:800;color:#0a2342;margin-bottom:3px;'>Department Directory</h2><p style='font-size:11px;color:#6b7280;'>"+total+" Members</p></div>";
  html+="<div id='deptBtns' style='display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:26px;'>";

  var depts=[
    {key:"digi",label:"Digi-Sales",icon:"🏢",gradient:"linear-gradient(135deg,#0a2342,#0e4d6e,#0a7c8c)",shadow:"rgba(10,35,66,0.3)",count:(data.digiSales||[]).length,tc:Object.keys(dTM).length},
    {key:"smriti",label:"Team Smriti",icon:"👥",gradient:"linear-gradient(135deg,#2d1b69,#5b21b6,#7c3aed)",shadow:"rgba(45,27,105,0.3)",count:sm.length,tc:1},
    {key:"onfield",label:"On-Field",icon:"🏃",gradient:"linear-gradient(135deg,#065f46,#059669,#10b981)",shadow:"rgba(6,95,70,0.3)",count:of.length,tc:1}
  ];
  depts.forEach(function(d){
    html+="<div onclick=\"showDeptSection('"+d.key+"')\" style=\"background:"+d.gradient+";border-radius:20px;padding:26px 20px;min-width:180px;flex:1;max-width:240px;cursor:pointer;overflow:hidden;box-shadow:0 6px 20px "+d.shadow+";transition:transform 0.22s,box-shadow 0.22s;\" onmouseover=\"this.style.transform='translateY(-6px) scale(1.02)'\" onmouseout=\"this.style.transform=''\">";
    html+="<div style='font-size:30px;margin-bottom:10px;'>"+d.icon+"</div>";
    html+="<div style='font-size:16px;font-weight:800;color:#fff;margin-bottom:10px;'>"+d.label+"</div>";
    html+="<div style='display:flex;gap:8px;'><div style='background:rgba(255,255,255,0.15);border-radius:9px;padding:5px 8px;text-align:center;flex:1;'><div style='font-size:20px;font-weight:900;color:#fff;'>"+d.count+"</div><div style='font-size:8px;color:rgba(255,255,255,0.65);text-transform:uppercase;margin-top:1px;'>Members</div></div><div style='background:rgba(255,255,255,0.15);border-radius:9px;padding:5px 8px;text-align:center;flex:1;'><div style='font-size:20px;font-weight:900;color:#ffd700;'>"+d.tc+"</div><div style='font-size:8px;color:rgba(255,255,255,0.65);text-transform:uppercase;margin-top:1px;'>Teams</div></div></div>";
    html+="<div style='margin-top:12px;background:rgba(255,255,255,0.15);border-radius:9px;padding:6px;text-align:center;font-size:10px;font-weight:700;color:#fff;'>View →</div></div>";
  });
  html+="</div>";

  /* Digi-Sales section */
  html+="<div id='dept-digi' style='display:none;'>";
  html+="<div style='display:flex;align-items:center;gap:8px;margin-bottom:14px;'><button onclick=\"hideDeptSection('digi')\" style='background:#0a2342;color:#fff;border:none;border-radius:8px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;'>← Back</button><h3 style='font-size:16px;font-weight:800;color:#0a2342;'>🏢 Digi-Sales Teams</h3></div>";
  html+="<div class='team-grid'>";
  Object.keys(dTM).forEach(function(teamName,ti){
    var members=dTM[teamName],pal=_palettes[ti%_palettes.length],teamId="digi_"+ti;
    var avH="<div class='avatar-cluster'>";
    var sc=Math.min(members.length,5);
    for(var ai=0;ai<sc;ai++){var mm=members[ai],w=mm.name.trim().split(" ");var ini=(w.length>=2?w[0][0]+w[1][0]:w[0].substring(0,2)).toUpperCase();avH+="<div class='avatar-3d' style='background:"+_avColors[ai%_avColors.length]+";' title='"+mm.name+"'>"+ini+"</div>";}
    if(members.length>5)avH+="<div class='avatar-3d' style='background:#6b7280;font-size:10px;'>+"+(members.length-5)+"</div>";
    avH+="</div>";
    var leaders=0,active=0;
    members.forEach(function(m){if((m.designation||"").toLowerCase().indexOf("leader")!==-1)leaders++;if((m.status||"").toLowerCase().indexOf("working")!==-1)active++;});
    var mJ=encodeURIComponent(JSON.stringify({teamName:teamName,members:members}));
    html+="<div class='team-card-3d'>";
    html+="<div class='team-card-banner' style='background:"+pal.bg+";'><span class='team-banner-title'>"+teamName+"</span></div>";
    html+=avH;
    html+="<div class='team-card-body'><div class='team-card-stats'>";
    html+="<div class='tc-stat'><div class='tc-stat-val'>"+members.length+"</div><div class='tc-stat-lbl'>Members</div></div>";
    html+="<div class='tc-stat'><div class='tc-stat-val'>"+leaders+"</div><div class='tc-stat-lbl'>Leaders</div></div>";
    html+="<div class='tc-stat'><div class='tc-stat-val'>"+active+"</div><div class='tc-stat-lbl'>Active</div></div>";
    html+="</div></div>";
    html+="<div class='team-card-footer'><button class='btn-view-team' onclick=\"toggleTeamMembers('"+teamId+"',event)\">View Team</button><button class='btn-export-team' onclick=\"exportWholeTeam('"+mJ+"',event)\">Export</button></div>";
    html+="<div class='team-members-panel' id='members_"+teamId+"'>"+buildMembersPanel(members)+"</div>";
    html+="</div>";
  });
  html+="</div></div>";

  /* Smriti section */
  html+="<div id='dept-smriti' style='display:none;'>";
  html+="<div style='display:flex;align-items:center;gap:8px;margin-bottom:14px;'><button onclick=\"hideDeptSection('smriti')\" style='background:#5b21b6;color:#fff;border:none;border-radius:8px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer;'>← Back</button><h3 style='font-size:16px;font-weight:800;color:#0a2342;'>👥 Team Smriti</h3></div>";
  html+=buildSimpleTeamTable(sm);
  html+="</div>";

  /* On-Field section */
  html+="<div id='dept-onfield' style='display:none;'>";
  html+="<div style='display:flex;align-items:center;gap:8px;margin-bottom:14px;'><button onclick=\"hideDeptSection('onfield')\" style='background:#059669;color:#fff;border:none;border-radius:8px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer;'>← Back</button><h3 style='font-size:16px;font-weight:800;color:#0a2342;'>🏃 On-Field Team</h3></div>";
  html+=buildSimpleTeamTable(of);
  html+="</div>";

  document.getElementById("deptListContainer").innerHTML=html;
}

function showDeptSection(k){document.getElementById("deptBtns").style.display="none";document.getElementById("dept-"+k).style.display="block";}
function hideDeptSection(k){document.getElementById("dept-"+k).style.display="none";document.getElementById("deptBtns").style.display="flex";}

function buildMembersPanel(members){
  var html="";
  members.forEach(function(m,idx){
    var w=m.name.trim().split(" ");var ini=(w.length>=2?w[0][0]+w[1][0]:w[0].substring(0,2)).toUpperCase();
    html+="<div class='member-row' onclick='showRMProfileCard(decodeURIComponent(\""+encodeURIComponent(JSON.stringify(m))+"\"))'>";
    html+="<div class='member-avatar-sm' style='background:"+_avColors[idx%_avColors.length]+";'>"+ini+"</div>";
    html+="<div class='member-info'><div class='member-name'>"+m.name+"</div><div class='member-desig'>"+(m.designation||"RM")+(m.contact?" · "+m.contact:"")+"</div></div>";
    html+="<span style='color:#0a7c8c;font-size:13px;'>›</span></div>";
  });
  return html;
}

function buildSimpleTeamTable(members){
  var html="<div style='background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.07);'><table style='width:100%;border-collapse:collapse;'>";
  html+="<thead><tr style='background:#0a2342;'><th style='color:#fff;font-size:9px;padding:8px 10px;text-align:center;'>#</th><th style='color:#fff;font-size:9px;padding:8px 10px;text-align:left;'>Name</th><th style='color:#e0f7fa;font-size:9px;padding:8px 10px;background:#0a5570;text-align:left;'>Designation</th><th style='color:#e0f7fa;font-size:9px;padding:8px 10px;background:#0a5570;text-align:left;'>Email</th><th style='color:#fff;font-size:9px;padding:8px 10px;text-align:center;'>Contact</th><th style='color:#fff;font-size:9px;padding:8px 10px;text-align:center;'>Status</th></tr></thead><tbody>";
  members.forEach(function(m,i){
    var w=m.name.trim().split(" ");var ini=(w.length>=2?w[0][0]+w[1][0]:w[0].substring(0,2)).toUpperCase();
    html+="<tr style='background:"+(i%2===0?'#f4fbfd':'#fff')+";border-bottom:1px solid #e8f4f8;cursor:pointer;transition:background 0.12s;' onclick='showRMProfileCard(decodeURIComponent(\""+encodeURIComponent(JSON.stringify(m))+"\"))' onmouseover='this.style.background=\"#d6f0f5\"' onmouseout='this.style.background=\""+(i%2===0?'#f4fbfd':'#fff')+"\";'>";
    html+="<td style='text-align:center;padding:8px 10px;font-size:10px;color:#6b7280;'>"+(i+1)+"</td>";
    html+="<td style='padding:8px 10px;'><div style='display:flex;align-items:center;gap:7px;'><div style='width:28px;height:28px;border-radius:50%;background:"+_avColors[i%_avColors.length]+";display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0;'>"+ini+"</div><span style='font-size:11px;font-weight:700;color:#0a2342;'>"+m.name+"</span></div></td>";
    html+="<td style='padding:8px 10px;font-size:11px;color:#0a2342;'>"+(m.designation||"-")+"</td>";
    html+="<td style='padding:8px 10px;font-size:11px;color:#0a7c8c;'>"+(m.email||"-")+"</td>";
    html+="<td style='padding:8px 10px;font-size:11px;text-align:center;'>"+(m.contact||"-")+"</td>";
    html+="<td style='padding:8px 10px;font-size:10px;text-align:center;'>"+(m.status||"-")+"</td></tr>";
  });
  return html+"</tbody></table></div>";
}

function toggleTeamMembers(teamId,evt){
  evt.stopPropagation();
  var p=document.getElementById("members_"+teamId);p.classList.toggle("open");
  var b=evt.target.closest(".btn-view-team");if(b)b.textContent=p.classList.contains("open")?"▲ Collapse":"View Team";
}

function exportWholeTeam(jsonStr,evt){
  evt.stopPropagation();
  var data=JSON.parse(decodeURIComponent(jsonStr));
  var rows=data.members.map(function(m,i){
    return'<tr style="background:'+(i%2===0?'#f4fbfd':'#fff')+'"><td style="padding:7px 10px;font-size:11px;color:#6b7280;text-align:center;">'+(i+1)+'</td><td style="padding:7px 10px;font-size:12px;font-weight:700;color:#0a2342;">'+m.name+'</td><td style="padding:7px 10px;font-size:11px;">'+(m.designation||'-')+'</td><td style="padding:7px 10px;font-size:11px;color:#0a7c8c;">'+(m.email||'-')+'</td><td style="padding:7px 10px;font-size:11px;text-align:center;">'+(m.contact||'-')+'</td><td style="padding:7px 10px;font-size:10px;text-align:center;">'+(m.status||'-')+'</td></tr>';
  }).join('');
  var win=window.open('','_blank','width=680,height=800');
  win.document.write('<html><head><title>'+data.teamName+'</title></head><body style="margin:0;font-family:Inter,sans-serif;background:#eef1f8;"><div style="max-width:680px;margin:24px auto;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 6px 24px rgba(10,35,66,0.14);"><div style="background:linear-gradient(120deg,#0a2342,#0e4d6e,#0a7c8c);padding:24px;text-align:center;"><div style="font-size:20px;font-weight:900;color:#fff;">'+data.teamName+'</div><div style="font-size:12px;color:rgba(255,255,255,0.65);margin-top:3px;">'+data.members.length+' Members</div></div><table style="width:100%;border-collapse:collapse;"><thead><tr style="background:#0a2342;"><th style="color:#fff;padding:9px 10px;font-size:9px;text-transform:uppercase;text-align:center;">#</th><th style="color:#fff;padding:9px 10px;font-size:9px;text-transform:uppercase;text-align:left;">Name</th><th style="color:#fff;padding:9px 10px;font-size:9px;text-transform:uppercase;text-align:left;">Designation</th><th style="color:#e0f7fa;padding:9px 10px;font-size:9px;text-transform:uppercase;text-align:left;background:#0a5570;">Email</th><th style="color:#fff;padding:9px 10px;font-size:9px;text-transform:uppercase;text-align:center;">Contact</th><th style="color:#fff;padding:9px 10px;font-size:9px;text-transform:uppercase;text-align:center;">Status</th></tr></thead><tbody>'+rows+'</tbody></table></div><script>setTimeout(function(){window.print();},350);<\/script></body></html>');
  win.document.close();
}

function showRMProfileCard(jsonStr){
  var m=JSON.parse(jsonStr);
  var w=m.name.trim().split(" ");var ini=(w.length>=2?w[0][0]+w[1][0]:w[0].substring(0,2)).toUpperCase();
  var modal=document.createElement("div");modal.className="kpi-modal-overlay";modal.id="kpiModal";
  modal.innerHTML="<div class='kpi-modal' id='kpiModalCard' style='width:460px'><div class='kpi-modal-header'><div class='kpi-modal-header-info'><div class='rm-profile-avatar'>"+ini+"</div><h3>"+m.name+"</h3><p>"+(m.designation||"")+(m.department?" · "+m.department:"")+"</p></div><button class='kpi-modal-close' onclick='closeModal()'>✕</button></div><div class='kpi-modal-body'><div class='rm-profile-info-grid'><div class='rm-info-row'><div class='rm-info-label'>CRM ID</div><div class='rm-info-value'>"+(m.crmId||"-")+"</div></div><div class='rm-info-row'><div class='rm-info-label'>Team</div><div class='rm-info-value'>"+(m.team||"-")+"</div></div><div class='rm-info-row full'><div class='rm-info-label'>Email</div><div class='rm-info-value'><a href='mailto:"+(m.email||"")+"'>"+(m.email||"-")+"</a></div></div><div class='rm-info-row'><div class='rm-info-label'>Contact</div><div class='rm-info-value'>"+(m.contact||"-")+"</div></div><div class='rm-info-row'><div class='rm-info-label'>Status</div><div class='rm-info-value'>"+(m.status||"-")+"</div></div></div></div><div class='kpi-modal-footer'><button class='btn-modal-dl btn-modal-close-btn' onclick='closeModal()'>Close</button><button class='btn-modal-dl btn-modal-jpg' onclick='downloadModalJPG()'>Download JPG</button></div></div>";
  document.body.appendChild(modal);
  modal.addEventListener("click",function(e){if(e.target===modal)closeModal();});
}
</script>
